<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>여우야우</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff7f0;
      font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #222;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
      text-align: center;
      max-width: 360px;
      width: calc(100% - 32px);
    }
    h1 { margin: 0 0 16px; font-size: 28px; }
    img { width: 180px; height: auto; }
    table { margin: 20px auto 12px; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px 14px; }
    th { background: #fafafa; }
    p { font-size: 14px; color: #666; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🦊 여우야우</h1>
    <img src="캐릭터.svg" alt="여우야우 캐릭터">
    <table>
      <tr><th>등급</th><th>레벨</th><th>체험치</th><th>도감</th></tr>
      <tr><td>견습생</td><td>7</td><td>360</td><td>0 / 40</td></tr>
    </table>
    <p>EDATA 9기 «클로드 코드 분석 조사 탐구기»의 세이브 파일입니다.</p>
  </div>
</body>
</html>
